<svg width="1160" height="680" viewBox="0 0 1160 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ask-Capitano deployment architecture map</title>
  <desc id="desc">A deployment map connecting website visitors, Ask-Capitano, GitHub Pages, Hugging Face Spaces, a voice layer, and CRM follow-up.</desc>
  <rect width="1160" height="680" rx="32" fill="#F6F2EA"/>
  <rect x="54" y="54" width="1052" height="572" rx="28" fill="#17212B"/>
  <path d="M152 182H1008" stroke="#E6DBC8" stroke-opacity=".22" stroke-width="2"/>
  <path d="M152 340H1008" stroke="#E6DBC8" stroke-opacity=".22" stroke-width="2"/>
  <path d="M152 498H1008" stroke="#E6DBC8" stroke-opacity=".22" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="116" y="123" fill="#F6F2EA" font-size="40" font-weight="700">Ask-Capitano deployment map</text>
    <text x="116" y="154" fill="#E6DBC8" font-size="18">Visitor intent to voice demo to deployment evidence</text>
  </g>
  <g font-family="Inter, Arial, sans-serif">
